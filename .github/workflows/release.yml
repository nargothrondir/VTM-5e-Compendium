name: Релиз

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например 1.0.5"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Релиз собирается только из проверенных исходников: битый компендиум,
      # однажды опубликованный, разойдётся по установкам через автообновление.
      - name: Проверить исходники
        run: python tools/verify.py

      - name: Круговой прогон сборки
        run: node tools/roundtrip.mjs

      - name: Определить версию
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Версия в манифесте — то, что увидит Foundry при обновлении. Если она
      # разошлась с тегом, модуль будет объявлять себя не тем, чем является,
      # и «обновление» на месте окажется откатом.
      - name: Сверить тег с манифестом
        run: |
          want='${{ steps.version.outputs.value }}'
          have=$(python -c "import sys,json; sys.path.insert(0,'tools'); import audit; print(json.loads((audit.module_dir()/'module.json').read_text(encoding='utf-8'))['version'])")
          if [ "$want" != "$have" ]; then
            echo "::error::тег v$want, а в манифесте $have"
            exit 1
          fi

      # Смысловая проверка обязательна и здесь: выпустить тихо испорченное
      # хуже, чем не выпустить вовсе.
      - name: Смысловая проверка
        run: python tools/audit.py

      - name: Собрать компендиумы
        run: npm run build

      - name: Собрать архив и манифест
        run: node tools/release.mjs "${{ steps.version.outputs.value }}"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/module.json
            dist/module.zip
